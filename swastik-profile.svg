    <text x="0" y="508" class="stat-lbl">MERGED PRs</text>
  </g>

  <!-- STAT 4: ACTIVE STREAK -->
  <!-- STAT: STREAK -->
  <g transform="translate(716, 0)">
    <text x="0" y="485" class="stat-num" id="stat-streak">29d</text>
    <text x="0" y="508" class="stat-lbl">ACTIVE STREAK</text>
  </g>

  <!-- STAT 5: STARS -->
  <!-- STAT: STARS -->
