      .stat-num { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 32px; font-weight: 800; fill: #EDE8DC; text-anchor: middle; letter-spacing: -0.5px; }
      .stat-lbl { font-family: 'Consolas', 'SF Mono', 'Courier New', monospace; font-size: 9.5px; font-weight: 600; fill: #7E8E85; letter-spacing: 1.2px; text-anchor: middle; }
