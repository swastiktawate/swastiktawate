<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" fill="none" role="img" aria-labelledby="profileTitle profileDesc">
  <title id="profileTitle">Swastik Tawate &#8212; Automation &amp; Robotics, AI/ML, Systems</title>
  <desc id="profileDesc">Engineering portfolio card featuring kinematics telemetry, toolkit, verified achievements, and live GitHub activity.</desc>
  <defs>
