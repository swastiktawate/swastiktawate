    <text x="73" y="12.5" fill="#34D399" class="mono" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">SHORTLISTED / ONGOING</text>
    <text x="0" y="40" fill="#EDE8DC" class="sans" font-size="16.5" font-weight="700">Yukti Hackathon + Ideathon</text>
    <text x="0" y="60" fill="#7E8E85" class="sans" font-size="12">Shortlisted &amp; active participant</text>
  </g>

  <!-- ==================== 03 / GITHUB ACTIVITY SECTION ==================== -->
  <text x="42" y="434" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">
    <tspan fill="#34D399">03 / </tspan><tspan fill="#EDE8DC">GITHUB ACTIVITY</tspan>
  </text>
  <line x1="230" y1="430" x2="982" y2="430" stroke="#1A261F" stroke-width="1"/>

  <!-- Vertical Divider Lines for Stats -->
  <line x1="220" y1="456" x2="220" y2="512" stroke="#1A261F" stroke-width="1"/>
  <line x1="422" y1="456" x2="422" y2="512" stroke="#1A261F" stroke-width="1"/>
  <line x1="608" y1="456" x2="608" y2="512" stroke="#1A261F" stroke-width="1"/>
  <line x1="825" y1="456" x2="825" y2="512" stroke="#1A261F" stroke-width="1"/>

  <!-- STAT 1: REPOSITORIES -->
  <!-- STAT: REPOSITORIES -->
  <g transform="translate(131, 0)">
    <text x="0" y="485" class="stat-num" id="stat-repos">29</text>
    <text x="0" y="508" class="stat-lbl">REPOSITORIES</text>
  </g>

  <!-- STAT 2: CONTRIBUTIONS -->
  <!-- STAT: CONTRIBUTIONS -->
  <g transform="translate(321, 0)">
    <text x="0" y="485" class="stat-num" id="stat-contribs">303</text>
    <text x="0" y="508" class="stat-lbl">CONTRIBUTIONS</text>
  </g>

  <!-- STAT 3: MERGED PRS -->
  <!-- STAT: MERGED_PRS -->
