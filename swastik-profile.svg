    <!-- 4. TS / JS -->
    <rect x="276" y="0" width="68" height="26" rx="6" fill="#111613" stroke="#203227" stroke-width="1"/>
    <text x="310" y="16.5" class="pill-txt">TS / JS</text>

    <!-- 5. FASTAPI -->
    <rect x="354" y="0" width="73" height="26" rx="6" fill="#111613" stroke="#203227" stroke-width="1"/>
    <text x="390.5" y="16.5" class="pill-txt">FASTAPI</text>

    <!-- 6. GEMINI -->
    <rect x="437" y="0" width="67" height="26" rx="6" fill="#111613" stroke="#203227" stroke-width="1"/>
    <text x="470.5" y="16.5" class="pill-txt">GEMINI</text>

    <!-- 7. SQL -->
    <rect x="514" y="0" width="53" height="26" rx="6" fill="#111613" stroke="#203227" stroke-width="1"/>
    <text x="540.5" y="16.5" class="pill-txt">SQL</text>

    <!-- 8. ESP32 -->
    <rect x="577" y="0" width="65" height="26" rx="6" fill="#111613" stroke="#203227" stroke-width="1"/>
    <text x="609.5" y="16.5" class="pill-txt">ESP32</text>

    <!-- 9. ToF / I²C -->
    <rect x="652" y="0" width="87" height="26" rx="6" fill="#111613" stroke="#203227" stroke-width="1"/>
    <text x="695.5" y="16.5" class="pill-txt">ToF / I&#178;C</text>

    <!-- 10. MATLAB -->
    <rect x="749" y="0" width="71" height="26" rx="6" fill="#111613" stroke="#203227" stroke-width="1"/>
    <text x="784.5" y="16.5" class="pill-txt">MATLAB</text>

    <!-- 11. GIT -->
    <rect x="830" y="0" width="53" height="26" rx="6" fill="#111613" stroke="#203227" stroke-width="1"/>
    <text x="856.5" y="16.5" class="pill-txt">GIT</text>

    <!-- 12. GITHUB -->
    <rect x="893" y="0" width="89" height="26" rx="6" fill="#111613" stroke="#203227" stroke-width="1"/>
    <text x="937.5" y="16.5" class="pill-txt">GITHUB</text>
  </g>

  <!-- ==================== 02 / SELECTED HIGHLIGHTS SECTION ==================== -->
  <text x="42" y="314" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">
    <tspan fill="#34D399">02 / </tspan><tspan fill="#EDE8DC">SELECTED HIGHLIGHTS</tspan>
  </text>
  <line x1="272" y1="310" x2="982" y2="310" stroke="#1A261F" stroke-width="1"/>

  <!-- Vertical Divider Lines for Highlights -->
  <line x1="338" y1="334" x2="338" y2="400" stroke="#1A261F" stroke-width="1"/>
  <line x1="668" y1="334" x2="668" y2="400" stroke="#1A261F" stroke-width="1"/>

  <!-- Highlight 1: Syrus 7.0 -->
  <g transform="translate(42, 332)">
    <rect x="0" y="0" width="62" height="18" rx="3.5" fill="#0C1813" stroke="#34D399" stroke-width="0.9"/>
    <text x="31" y="12.5" fill="#34D399" class="mono" font-size="8.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">FINALIST</text>
    <text x="0" y="40" fill="#EDE8DC" class="sans" font-size="16.5" font-weight="700">Syrus 7.0 Hackathon</text>
    <text x="0" y="60" fill="#7E8E85" class="sans" font-size="12">Competitive multi-round hackathon</text>
  </g>

  <!-- Highlight 2: ISTE-VESIT -->
  <g transform="translate(378, 332)">
    <rect x="0" y="0" width="62" height="18" rx="3.5" fill="#0C1813" stroke="#34D399" stroke-width="0.9"/>
    <text x="31" y="12.5" fill="#34D399" class="mono" font-size="8.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">FINALIST</text>
    <text x="0" y="40" fill="#EDE8DC" class="sans" font-size="16.5" font-weight="700">ISTE-VESIT Ideathon</text>
    <text x="0" y="60" fill="#7E8E85" class="sans" font-size="12">Technical innovation &amp; defense</text>
  </g>

  <!-- Highlight 3: Yukti -->
  <g transform="translate(708, 332)">
