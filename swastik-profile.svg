<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" fill="none" role="img" aria-labelledby="profileTitle profileDesc">
  <title id="profileTitle">Swastik Tawate &#8212; Automation &amp; Robotics, AI/ML, Systems</title>
  <desc id="profileDesc">Engineering portfolio card featuring kinematics telemetry, toolkit, verified achievements, and live GitHub activity.</desc>
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1210"/>
      <stop offset="50%" stop-color="#101412"/>
      <stop offset="100%" stop-color="#0D110F"/>
    </linearGradient>

    <!-- Subtle Optical Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Creed Static Accent Gradient -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      .mono { font-family: 'Consolas', 'SF Mono', 'Courier New', monospace; }
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .stat-num { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 32px; font-weight: 800; fill: #EDE8DC; text-anchor: middle; letter-spacing: -0.5px; }
      .stat-lbl { font-family: 'Consolas', 'SF Mono', 'Courier New', monospace; font-size: 9.5px; font-weight: 600; fill: #7E8E85; letter-spacing: 1.2px; text-anchor: middle; }
      .pill-txt { font-family: 'Consolas', 'SF Mono', 'Courier New', monospace; font-size: 10.5px; font-weight: 600; fill: #EDE8DC; letter-spacing: 0.8px; text-anchor: middle; }
      .link-item { text-decoration: none; cursor: pointer; }
      .link-item:hover { opacity: 0.85; }
    </style>
  </defs>

  <!-- ==================== BACKGROUND CARD ==================== -->
  <rect width="1024" height="576" fill="url(#bgGrad)" rx="10"/>
  <rect width="1024" height="576" fill="none" stroke="#1A261F" stroke-width="1.2" rx="10"/>

  <!-- ==================== HEADER SECTION ==================== -->
  <!-- Top Tagline Indicator with Ultra-Smooth Spline Breathing -->
  <rect x="42" y="32.5" width="8" height="8" fill="#34D399" rx="1.5">
    <animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="40" fill="#8E9E96" class="mono" font-size="11.5" font-weight="600" letter-spacing="1.5">AUTOMATION &amp; ROBOTICS / AI &amp; SYSTEMS</text>
  <line x1="390" y1="36" x2="982" y2="36" stroke="#1A261F" stroke-width="1"/>

  <!-- Primary Headline Name -->
  <text x="42" y="112" fill="#EDE8DC" class="sans" font-size="52" font-weight="900" letter-spacing="0.5">SWASTIK TAWATE</text>

  <!-- Subtitle Line 1 -->
  <text x="42" y="142" fill="#D6DDD8" class="sans" font-size="17" font-weight="600" letter-spacing="0.2">Automation &amp; Robotics &#183; AI/ML &#183; Systems</text>

  <!-- Subtitle Line 2 -->
  <text x="42" y="167" fill="#7E8E85" class="sans" font-size="13" font-weight="400">Undergraduate at VESIT Mumbai &#183; B.Tech in Automation &amp; Robotics</text>

  <!-- Creed / Precision Scanning Line -->
  <!-- 1. Static Green Pill Accent -->
  <rect x="42" y="191" width="54" height="4" rx="2" fill="url(#laserBeam)" filter="url(#softGlow)"/>

  <!-- 2. Tagline Text with Terminal Blinking Block Cursor -->
  <text x="110" y="195.5" fill="#34D399" class="mono" font-size="11" font-weight="600" letter-spacing="1.8">PRECISION IN CODE. PURPOSE IN AUTOMATION.</text>
  <!-- Terminal block cursor: ultra-smooth high-refresh transition (subtle 50ms ease) -->
  <rect x="435.5" y="186" width="5.5" height="11" rx="0.8" fill="#34D399">
    <animate attributeName="opacity" values="1; 1; 0.08; 0.08; 1" keyTimes="0; 0.46; 0.52; 0.94; 1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1" dur="1.15s" repeatCount="indefinite"/>
  </rect>

  <!-- 3. Base Structural Line -->
  <line x1="456" y1="193" x2="982" y2="193" stroke="#1A261F" stroke-width="1.2"/>

  <!-- 4. Precision Periodic Scanning Segment: Continuous smooth loop with GPU translation and cubic spline -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="456,0; 934,0; 934,0; 456,0"
      keyTimes="0; 0.88; 0.96; 1"
      calcMode="spline"
      keySplines="0.35 0 0.2 1; 0 0 0 0; 0 0 0 0"
      dur="3s" repeatCount="indefinite"/>
    <g>
      <animate attributeName="opacity"
        values="0; 1; 1; 0; 0"
        keyTimes="0; 0.08; 0.82; 0.88; 1"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 0 0"
        dur="3s" repeatCount="indefinite"/>
      <!-- Multi-layered pure vector optical glow (zero CPU filter rasterization latency) -->
      <rect x="0" y="190.5" width="48" height="5" rx="2.5" fill="#34D399" fill-opacity="0.22"/>
      <rect x="2" y="191.5" width="44" height="3" rx="1.5" fill="#34D399" fill-opacity="0.6"/>
      <rect x="5" y="192" width="38" height="2" rx="1" fill="#EDE8DC" fill-opacity="0.95"/>
    </g>
  </g>

  <!-- ==================== ORBITAL KINEMATICS TELEMETRY ==================== -->
  <g transform="translate(840, 110)">
    <!-- Radar Coordinate Axes -->
    <line x1="-165" y1="0" x2="145" y2="0" stroke="#1C2E24" stroke-width="0.8" stroke-dasharray="3 4"/>
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#1C2E24" stroke-width="0.8" stroke-dasharray="3 4"/>

    <!-- Concentric Stationary Orbits with Instrumentation Highlight and Active Satellite -->
    <!-- Orbit 1: Primary wide tilted orbit (Rotated -22deg, perfectly stationary geometric paths) -->
    <g transform="rotate(-22)">
      <!-- Stationary structural ellipse track -->
      <ellipse rx="140" ry="48" fill="none" stroke="#263B30" stroke-width="1"/>

      <!-- Smooth gliding highlight beam along the stationary orbit track -->
      <path d="M -140,0 A 140,48 0 1 0 140,0 A 140,48 0 1 0 -140,0" fill="none" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="70 930" pathLength="1000">
        <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="20s" repeatCount="indefinite"/>
      </path>

      <!-- Stationary reference satellite node (top-left) -->
      <circle cx="-110" cy="-29" r="3.2" fill="#0E1210" stroke="#EDE8DC" stroke-width="1.2"/>

      <!-- ACTIVE TELEMETRY SATELLITE: Pure vector GPU composition (zero blur filter penalty) -->
      <g>
        <!-- Outer luminous aura -->
        <circle r="7.5" fill="#34D399" fill-opacity="0.18"/>
        <circle r="4.8" fill="#34D399" fill-opacity="0.55"/>
        <circle r="2.8" fill="#EDE8DC"/>
        <circle r="1.2" fill="#10B981"/>
        <!-- Expanding instrumentation beacon ping -->
        <circle r="3.5" fill="none" stroke="#34D399" stroke-width="0.8">
          <animate attributeName="r" values="3.5; 9.5; 3.5" keyTimes="0; 0.65; 1" calcMode="spline" keySplines="0.2 0 0.2 1; 0.2 0 0.2 1" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.8; 0; 0" keyTimes="0; 0.65; 1" calcMode="spline" keySplines="0.2 0 0.2 1; 0.2 0 0.2 1" dur="3s" repeatCount="indefinite"/>
        </circle>
        <!-- Native SMIL smooth continuous motion along the exact elliptical trajectory -->
        <animateMotion path="M -140,0 A 140,48 0 1 0 140,0 A 140,48 0 1 0 -140,0" dur="24s" calcMode="linear" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Orbit 2: Counter-tilted orbit (Rotated +18deg, stationary reference track) -->
    <g transform="rotate(18)">
      <ellipse rx="110" ry="40" fill="none" stroke="#1E3327" stroke-width="1" stroke-dasharray="5 3"/>
      <!-- Stationary reference node -->
      <circle cx="82" cy="-26" r="3.6" fill="#0E1210" stroke="#EDE8DC" stroke-width="1.2"/>
    </g>

    <!-- Orbit 3: Steep inner orbit (Rotated -38deg, stationary track with node) -->
    <g transform="rotate(-38)">
      <ellipse rx="76" ry="28" fill="none" stroke="#2B4436" stroke-width="1"/>
      <circle cx="52" cy="20" r="2.2" fill="#34D399"/>
    </g>

    <!-- Orbit 4: Outer tracking perimeter (Rotated +34deg) -->
    <g transform="rotate(34)">
      <ellipse rx="148" ry="64" fill="none" stroke="#182A20" stroke-width="0.8"/>
      <circle cx="-120" cy="38" r="2.8" fill="#0E1210" stroke="#34D399" stroke-width="1"/>
    </g>

    <!-- Center Celestial Body & Subtle Instrumentation Pulse -->
    <!-- Outer fixed reference rings -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#34D399" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#34D399" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Expanding telemetry pulse ring with smooth spline ease -->
    <circle cx="0" cy="0" r="5" fill="none" stroke="#34D399" stroke-width="1">
      <animate attributeName="r" values="5; 20; 20" keyTimes="0; 0.65; 1" calcMode="spline" keySplines="0.2 0 0.2 1; 0 0 0 0" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.55; 0; 0" keyTimes="0; 0.65; 1" calcMode="spline" keySplines="0.2 0 0.2 1; 0 0 0 0" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Core celestial sphere: Pure vector glow layers (no filter raster cost) -->
    <circle cx="0" cy="0" r="8.5" fill="#34D399" fill-opacity="0.18"/>
    <circle cx="0" cy="0" r="5.5" fill="#34D399" fill-opacity="0.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#EDE8DC">
      <animate attributeName="opacity" values="0.85; 1; 0.85" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Subtle Technical Crosshairs -->
    <text x="-145" y="-42" fill="#3A5344" class="mono" font-size="12" text-anchor="middle">+</text>
    <text x="125" y="62" fill="#3A5344" class="mono" font-size="12" text-anchor="middle">+</text>
  </g>

  <!-- ==================== 01 / TOOLKIT SECTION ==================== -->
  <text x="42" y="221" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">
    <tspan fill="#34D399">01 / </tspan><tspan fill="#EDE8DC">TOOLKIT</tspan>
  </text>
  <line x1="162" y1="217" x2="982" y2="217" stroke="#1A261F" stroke-width="1"/>

  <!-- 12 Toolkit Pills Row (Clean & Stationary) -->
  <g transform="translate(0, 252)">
    <!-- 1. PYTHON -->
    <rect x="42" y="0" width="67" height="26" rx="6" fill="#111613" stroke="#203227" stroke-width="1"/>
