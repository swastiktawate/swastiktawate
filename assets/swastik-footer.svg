<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="65" viewBox="0 0 1200 65" role="img" aria-labelledby="footTitle footDesc">
  <title id="footTitle">Connect &amp; Systems — Swastik Tawate</title>
  <desc id="footDesc">Ultra-compact graphite and emerald green footer featuring email, LinkedIn, and engineering creed.</desc>
  <defs>
    <linearGradient id="gemFootBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0B"/>
      <stop offset="50%" stop-color="#0E1714"/>
      <stop offset="100%" stop-color="#05241A"/>
    </linearGradient>
    <linearGradient id="gemFootGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6EE7B7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="65" rx="10" fill="url(#gemFootBg)"/>
  <rect width="1200" height="65" rx="10" fill="none" stroke="#16382B" stroke-width="1.2"/>

  <!-- Top Kinetic Laser Line -->
  <path d="M30 12 H1170" stroke="#0B3022" stroke-width="1"/>
  <path d="M30 12 H1170" stroke="url(#gemFootGlow)" stroke-width="1.8" stroke-dasharray="140 1000">
    <animate attributeName="stroke-dashoffset" values="0;-1140" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Single Elegant Row: Email | Slogan | LinkedIn -->
  <g transform="translate(600, 42)">
    <!-- 1. Email (Left) -->
    <a href="mailto:swastiktawate.work@gmail.com" target="_blank" style="cursor: pointer;">
      <g transform="translate(-480, 0)">
        <!-- Envelope Icon -->
        <rect x="0" y="-8" width="16" height="11" rx="1.5" fill="#0C2017" stroke="#34D399" stroke-width="1.2"/>
        <path d="M 0 -6 L 8 -1 L 16 -6" fill="none" stroke="#6EE7B7" stroke-width="1.2"/>
        <text x="24" y="1" fill="#A7F3D0" font-family="'Consolas', monospace" font-size="11.5" font-weight="600" letter-spacing="0.4">swastiktawate.work@gmail.com</text>
      </g>
    </a>

    <!-- Center Separator -->
    <circle cx="-190" cy="-2" r="2" fill="#34D399" opacity="0.6"/>

    <!-- 2. Slogan (Center) -->
    <text x="0" y="1.5" text-anchor="middle" fill="#F0FDF4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2">IDEAS INTO SYSTEMS. SYSTEMS INTO IMPACT.</text>

    <!-- Center Separator -->
    <circle cx="190" cy="-2" r="2" fill="#34D399" opacity="0.6"/>

    <!-- 3. LinkedIn (Right) -->
    <a href="https://www.linkedin.com/in/swastiktawate" target="_blank" style="cursor: pointer;">
      <g transform="translate(230, 0)">
        <!-- LinkedIn Badge Icon -->
        <rect x="0" y="-9" width="15" height="15" rx="2.5" fill="#0C2017" stroke="#34D399" stroke-width="1.2"/>
        <text x="7.5" y="2.5" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9" font-weight="800">in</text>
        <text x="22" y="1" fill="#A7F3D0" font-family="'Consolas', monospace" font-size="11.5" font-weight="600" letter-spacing="0.4">linkedin.com/in/swastiktawate</text>
      </g>
    </a>
  </g>
</svg>