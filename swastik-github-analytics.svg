<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="135" viewBox="0 0 1200 135" role="img" aria-labelledby="gaTitle gaDesc">
  <title id="gaTitle">GitHub Analytics Telemetry &#8212; Swastik Tawate</title>
  <desc id="gaDesc">Compact telemetry metric display with repositories, contributions, merged pull requests, active streak, and stars.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0B"/>
      <stop offset="50%" stop-color="#0E1714"/>
      <stop offset="100%" stop-color="#05241A"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="gaCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121D18"/>
      <stop offset="100%" stop-color="#0B1310"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="gaCardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4737"/>
      <stop offset="100%" stop-color="#102B20"/>
    </linearGradient>

    <!-- Scanning Laser Gradient -->
    <linearGradient id="gaLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6EE7B7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#34D399" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Container Base & Grid -->
  <rect width="1200" height="135" rx="14" fill="url(#gaBg)"/>
  <rect width="1200" height="135" rx="14" fill="url(#gaGrid)"/>
  <rect width="1200" height="135" rx="14" fill="none" stroke="#16382B" stroke-width="1.2"/>

  <!-- Top Header & Status Bar -->
  <g transform="translate(60, 22)">
    <!-- Live Status Pill -->
    <rect width="155" height="18" rx="9" fill="#0C1914" stroke="#1C4434" stroke-width="1"/>
    <circle cx="10" cy="9" r="3" fill="#34D399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="12" fill="#6EE7B7" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.5">LIVE TELEMETRY</text>

    <!-- Header Title -->
    <text x="175" y="13" fill="#F0FDF4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">GITHUB ANALYTICS</text>

    <!-- Scanning Laser Line -->
    <path d="M 320 9 H 1080" stroke="#143628" stroke-width="1"/>
    <path d="M 320 9 H 1080" stroke="url(#gaLaser)" stroke-width="1.6" stroke-dasharray="140 620">
      <animate attributeName="stroke-dashoffset" values="0;-760" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ==================== 5 COMPACT TELEMETRY CARDS ==================== -->
  <!-- Width: 196, Height: 76, Gap: 25, Start X: 60, Y: 44 -->

  <!-- CARD 1: REPOSITORIES -->
  <g transform="translate(60, 44)">
    <rect width="196" height="76" rx="10" fill="url(#gaCardBg)" stroke="url(#gaCardBorder)" stroke-width="1.2"/>
    <circle cx="180" cy="14" r="2.5" fill="#34D399" opacity="0.6"/>
    <!-- Icon -->
    <g transform="translate(26, 38)" stroke="#34D399" stroke-width="1.6" fill="none">
      <path d="M -8 -8 H 2 C 4 -8 6 -6 6 -4 V 8 C 6 6 4 6 2 6 H -8 Z"/>
      <path d="M -8 -8 H -11 C -13 -8 -15 -6 -15 -4 V 8 C -15 6 -13 6 -11 6 H -8 Z"/>
      <line x1="-8" y1="-8" x2="-8" y2="6"/>
    </g>
    <!-- Value -->
    <text x="50" y="38" fill="#F0FDF4" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">16</text>
    <!-- Labels -->
    <text x="50" y="52" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="9" font-weight="700" letter-spacing="1.2">REPOSITORIES</text>
    <text x="50" y="65" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Public Codebases</text>
  </g>

  <!-- CARD 2: CONTRIBUTIONS MADE -->
  <g transform="translate(281, 44)">
    <rect width="196" height="76" rx="10" fill="url(#gaCardBg)" stroke="url(#gaCardBorder)" stroke-width="1.2"/>
    <circle cx="180" cy="14" r="2.5" fill="#34D399" opacity="0.6"/>
    <!-- Icon -->
    <g transform="translate(26, 38)">
      <circle cx="-6" cy="-5" r="2.8" fill="#10B981"/>
      <circle cx="4" cy="-5" r="2.8" fill="#34D399"/>
      <circle cx="-6" cy="5" r="2.8" fill="#6EE7B7"/>
      <circle cx="4" cy="5" r="2.8" fill="#A7F3D0"/>
    </g>
    <!-- Value -->
    <text x="50" y="38" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">67</text>
    <!-- Labels -->
    <text x="50" y="52" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="9" font-weight="700" letter-spacing="1.2">CONTRIBUTIONS</text>
    <text x="50" y="65" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Yearly Activity</text>
  </g>

  <!-- CARD 3: TOTAL MERGED PULL REQUESTS -->
  <g transform="translate(502, 44)">
    <rect width="196" height="76" rx="10" fill="url(#gaCardBg)" stroke="url(#gaCardBorder)" stroke-width="1.2"/>
    <circle cx="180" cy="14" r="2.5" fill="#34D399" opacity="0.6"/>
    <!-- PR Merge Icon -->
    <g transform="translate(26, 38)" stroke="#34D399" stroke-width="1.6" fill="none">
      <circle cx="-7" cy="-5" r="2.5" fill="#A7F3D0"/>
      <circle cx="-7" cy="6" r="2.5"/>
      <circle cx="5" cy="1" r="2.5" fill="#34D399"/>
      <path d="M -7 -2.5 V 3.5"/>
      <path d="M -7 -2.5 C -7 1 -4 1 2.5 1"/>
    </g>
    <!-- Value -->
    <text x="50" y="38" fill="#F0FDF4" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">8</text>
    <!-- Labels -->
    <text x="50" y="52" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="8.5" font-weight="700" letter-spacing="0.8">TOTAL MERGED PRS</text>
    <text x="50" y="65" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Pull Requests Merged</text>
  </g>

  <!-- CARD 4: CONTRIBUTION STREAK -->
  <g transform="translate(723, 44)">
    <rect width="196" height="76" rx="10" fill="url(#gaCardBg)" stroke="url(#gaCardBorder)" stroke-width="1.2"/>
    <circle cx="180" cy="14" r="2.5" fill="#34D399" opacity="0.6"/>
    <!-- Crisp Vector Flame (Zero Blur Filter) -->
    <g transform="translate(26, 36)">
      <path d="M 0 11 C 6 11 10 7 10 1.5 C 10 -3 7.5 -6 5 -9 C 4.5 -6 2.5 -4 1 -3 C 1 -5.5 0.5 -9 -2 -12 C -3 -8 -6.5 -4.5 -6.5 -1 C -6.5 0.5 -5.5 2 -3.5 3 C -5.5 4 -6.5 6 -6.5 7.5 C -6.5 9.5 -3.5 11 0 11 Z" fill="#34D399" stroke="#10B981" stroke-width="0.7"/>
      <path d="M 0 9 C 3 9 5 7 5 4 C 5 1.5 3.5 0 2.5 -1 C 1.8 0.5 0.8 1.5 0 2 C 0 1 -0.5 -0.5 -1.5 -2 C -2.2 -0.5 -3 1 -3 3.5 C -3 6.5 -1.5 9 0 9 Z" fill="#F0FDF4"/>
    </g>
    <!-- Value -->
    <text x="50" y="38" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">10d</text>
    <!-- Labels -->
    <text x="50" y="52" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="9" font-weight="700" letter-spacing="1.2">ACTIVE STREAK</text>
    <text x="50" y="65" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Consecutive Days</text>
  </g>

  <!-- CARD 5: STARS GOT -->
  <g transform="translate(944, 44)">
    <rect width="196" height="76" rx="10" fill="url(#gaCardBg)" stroke="url(#gaCardBorder)" stroke-width="1.2"/>
    <circle cx="180" cy="14" r="2.5" fill="#34D399" opacity="0.6"/>
    <!-- Crisp Vector 5-Point Star (Zero Blur Filter) -->
    <g transform="translate(26, 36)">
      <polygon points="0,-11 3.2,-3.5 11,-2.7 5.2,2.5 6.8,10.2 0,6.2 -6.8,10.2 -5.2,2.5 -11,-2.7 -3.2,-3.5" fill="#34D399" stroke="#6EE7B7" stroke-width="0.9"/>
      <polygon points="0,-6 1.7,-1.8 6,-1.4 2.8,1.4 3.7,5.5 0,3.3 -3.7,5.5 -2.8,1.4 -6,-1.4 -1.7,-1.8" fill="#F0FDF4"/>
    </g>
    <!-- Value -->
    <text x="50" y="38" fill="#F0FDF4" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">2</text>
    <!-- Labels -->
    <text x="50" y="52" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="9" font-weight="700" letter-spacing="1.2">STARS GOT</text>
    <text x="50" y="65" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Earned Stargazers</text>
  </g>
</svg>
