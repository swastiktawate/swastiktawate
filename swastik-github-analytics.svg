<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="gaTitle gaDesc">
  <title id="gaTitle">Swastik Tawate — GitHub Analytics</title>
  <desc id="gaDesc">Live verified telemetry dashboard displaying total repositories, contributions, merged pull requests, active contribution streak, and stargazers in a graphite and emerald green theme.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0B"/>
      <stop offset="50%" stop-color="#0E1714"/>
      <stop offset="100%" stop-color="#05241A"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="gaCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121D18"/>
      <stop offset="100%" stop-color="#0B1310"/>
    </linearGradient>

    <!-- Card Highlight Gradient -->
    <linearGradient id="gaCardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4737"/>
      <stop offset="100%" stop-color="#102B20"/>
    </linearGradient>

    <!-- Scanning Laser Gradient -->
    <linearGradient id="gaLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6EE7B7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gaGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#34D399" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="30" cy="30" r="0.8" fill="#10B981" fill-opacity="0.15"/>
    </pattern>

    <!-- Blur & Glow Filters -->
    <filter id="gaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
    </filter>
    <filter id="gaTightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="tight"/>
    </filter>
  </defs>

  <!-- Container Base & Grid -->
  <rect width="1200" height="260" rx="18" fill="url(#gaBg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#gaGrid)"/>
  <rect width="1200" height="260" rx="18" fill="none" stroke="#16382B" stroke-width="1.2"/>

  <!-- Top Header & Status Bar -->
  <g transform="translate(60, 32)">
    <!-- Live Status Pill -->
    <rect width="165" height="22" rx="11" fill="#0C1914" stroke="#1C4434" stroke-width="1"/>
    <circle cx="12" cy="11" r="3.5" fill="#34D399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="11" r="6.5" fill="none" stroke="#10B981" stroke-opacity="0.5">
      <animate attributeName="r" values="3.5;8;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="14.5" fill="#6EE7B7" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.8">LIVE TELEMETRY</text>

    <!-- Header Title -->
    <text x="190" y="16" fill="#F0FDF4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">GITHUB ANALYTICS</text>

    <!-- Animated Scanning Laser Line -->
    <path d="M 370 11 H 1080" stroke="#143628" stroke-width="1"/>
    <path d="M 370 11 H 1080" stroke="url(#gaLaser)" stroke-width="2" stroke-dasharray="140 570">
      <animate attributeName="stroke-dashoffset" values="0;-710" dur="7.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ==================== 5 TELEMETRY METRIC CARDS ==================== -->
  <!-- Card dimensions: width 196, height 150. Start X=60, Gap=25. Y=76 -->

  <!-- CARD 1: REPOSITORIES -->
  <g transform="translate(60, 76)">
    <rect width="196" height="150" rx="14" fill="url(#gaCardBg)" stroke="url(#gaCardBorder)" stroke-width="1.3"/>
    <!-- Top-Right Accent Dot -->
    <circle cx="178" cy="18" r="3" fill="#34D399" opacity="0.6"/>
    <!-- Icon: Repository Book -->
    <g transform="translate(32, 38)" stroke="#34D399" stroke-width="1.8" fill="none">
      <path d="M -10 -10 H 2 C 5 -10 8 -8 8 -5 V 10 C 8 7 5 7 2 7 H -10 Z"/>
      <path d="M -10 -10 H -14 C -17 -10 -20 -8 -20 -5 V 10 C -20 7 -17 7 -14 7 H -10 Z"/>
      <line x1="-10" y1="-10" x2="-10" y2="7"/>
    </g>
    <!-- Big Value -->
    <text x="64" y="46" fill="#F0FDF4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">16</text>
    <!-- Title Label -->
    <text x="24" y="94" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="11" font-weight="700" letter-spacing="1.5">REPOSITORIES</text>
    <!-- Subtitle Detail -->
    <text x="24" y="116" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">Public Codebases</text>
    <!-- Bottom Progress Track -->
    <rect x="24" y="132" width="148" height="3" rx="1.5" fill="#0D261C"/>
    <rect x="24" y="132" width="85" height="3" rx="1.5" fill="#10B981"/>
  </g>

  <!-- CARD 2: CONTRIBUTIONS MADE -->
  <g transform="translate(281, 76)">
    <rect width="196" height="150" rx="14" fill="url(#gaCardBg)" stroke="url(#gaCardBorder)" stroke-width="1.3"/>
    <circle cx="178" cy="18" r="3" fill="#34D399" opacity="0.6"/>
    <!-- Icon: Contribution Git Matrix -->
    <g transform="translate(32, 38)">
      <circle cx="-10" cy="-6" r="3.5" fill="#10B981"/>
      <circle cx="2" cy="-6" r="3.5" fill="#34D399"/>
      <circle cx="-10" cy="6" r="3.5" fill="#6EE7B7"/>
      <circle cx="2" cy="6" r="3.5" fill="#A7F3D0"/>
      <circle cx="14" cy="0" r="3.5" fill="#34D399"/>
    </g>
    <!-- Big Value -->
    <text x="64" y="46" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">57+</text>
    <!-- Title Label -->
    <text x="24" y="94" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="11" font-weight="700" letter-spacing="1.5">CONTRIBUTIONS</text>
    <!-- Subtitle Detail -->
    <text x="24" y="116" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">Yearly Activity</text>
    <!-- Bottom Progress Track -->
    <rect x="24" y="132" width="148" height="3" rx="1.5" fill="#0D261C"/>
    <rect x="24" y="132" width="115" height="3" rx="1.5" fill="#34D399"/>
  </g>

  <!-- CARD 3: MERGED PULL REQUESTS -->
  <g transform="translate(502, 76)">
    <rect width="196" height="150" rx="14" fill="url(#gaCardBg)" stroke="url(#gaCardBorder)" stroke-width="1.3"/>
    <circle cx="178" cy="18" r="3" fill="#34D399" opacity="0.6"/>
    <!-- Icon: Merged PR -->
    <g transform="translate(32, 38)" stroke="#34D399" stroke-width="1.8" fill="none">
      <circle cx="-10" cy="-6" r="3" fill="#A7F3D0"/>
      <circle cx="-10" cy="8" r="3"/>
      <circle cx="4" cy="2" r="3" fill="#34D399"/>
      <path d="M -10 -3 V 5"/>
      <path d="M -10 -3 C -10 2 -6 2 1 2"/>
    </g>
    <!-- Big Value -->
    <text x="64" y="46" fill="#F0FDF4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">8</text>
    <!-- Title Label -->
    <text x="24" y="94" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="11" font-weight="700" letter-spacing="1.5">MERGED PRS</text>
    <!-- Subtitle Detail -->
    <text x="24" y="116" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">Merged Codebases</text>
    <!-- Bottom Progress Track -->
    <rect x="24" y="132" width="148" height="3" rx="1.5" fill="#0D261C"/>
    <rect x="24" y="132" width="95" height="3" rx="1.5" fill="#10B981"/>
  </g>

  <!-- CARD 4: CONTRIBUTION STREAK -->
  <g transform="translate(723, 76)">
    <rect width="196" height="150" rx="14" fill="url(#gaCardBg)" stroke="url(#gaCardBorder)" stroke-width="1.3"/>
    <circle cx="178" cy="18" r="3" fill="#34D399" opacity="0.6"/>
    <!-- Icon: Streak Flame -->
    <g transform="translate(30, 38)">
      <path d="M 0 10 C 6 10 10 6 10 0 C 10 -6 4 -10 2 -14 C 1 -11 -1 -8 -4 -6 C -6 -4 -7 -1 -7 2 C -7 6 -4 10 0 10 Z" fill="#34D399" filter="url(#gaTightGlow)"/>
      <path d="M 0 8 C 3 8 5 5 5 2 C 5 -1 2 -4 1 -6 C 0 -4 -1 -3 -2 -1 C -3 0 -4 1 -4 3 C -4 6 -2 8 0 8 Z" fill="#F0FDF4"/>
    </g>
    <!-- Big Value -->
    <text x="64" y="46" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">10d</text>
    <!-- Title Label -->
    <text x="24" y="94" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="11" font-weight="700" letter-spacing="1.5">ACTIVE STREAK</text>
    <!-- Subtitle Detail -->
    <text x="24" y="116" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">Consecutive Days</text>
    <!-- Bottom Progress Track -->
    <rect x="24" y="132" width="148" height="3" rx="1.5" fill="#0D261C"/>
    <rect x="24" y="132" width="130" height="3" rx="1.5" fill="#6EE7B7"/>
  </g>

  <!-- CARD 5: STARS GOT -->
  <g transform="translate(944, 76)">
    <rect width="196" height="150" rx="14" fill="url(#gaCardBg)" stroke="url(#gaCardBorder)" stroke-width="1.3"/>
    <circle cx="178" cy="18" r="3" fill="#34D399" opacity="0.6"/>
    <!-- Icon: Star -->
    <g transform="translate(32, 38)">
      <polygon points="0,-12 3.5,-3 12,-3 5,2 7.5,11 0,6 -7.5,11 -5,2 -12,-3 -3.5,-3" fill="#A7F3D0" filter="url(#gaTightGlow)"/>
      <polygon points="0,-8 2,-2 8,-2 3.5,1.5 5,7 0,4 -5,7 -3.5,1.5 -8,-2 -2,-2" fill="#F0FDF4"/>
    </g>
    <!-- Big Value -->
    <text x="64" y="46" fill="#F0FDF4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">2</text>
    <!-- Title Label -->
    <text x="24" y="94" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="11" font-weight="700" letter-spacing="1.5">STARS GOT</text>
    <!-- Subtitle Detail -->
    <text x="24" y="116" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">Earned Stargazers</text>
    <!-- Bottom Progress Track -->
    <rect x="24" y="132" width="148" height="3" rx="1.5" fill="#0D261C"/>
    <rect x="24" y="132" width="55" height="3" rx="1.5" fill="#10B981"/>
  </g>

  <!-- Precision Corner Framing Marks -->
  <g stroke="#34D399" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M 20 40 L 20 20 L 40 20"/>
    <path d="M 1160 20 L 1180 20 L 1180 40"/>
    <path d="M 20 220 L 20 240 L 40 240"/>
    <path d="M 1160 240 L 1180 240 L 1180 220"/>
  </g>
</svg>
