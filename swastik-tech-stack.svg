<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="135" viewBox="0 0 1200 135" role="img" aria-labelledby="tsTitle tsDesc">
  <title id="tsTitle">Swastik Tawate — Verified Tech Stack</title>
  <desc id="tsDesc">Compact curated technology stack showcasing verified programming languages, robotics, embedded systems, APIs, and developer tools in a graphite and emerald green palette.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0B"/>
      <stop offset="50%" stop-color="#0F1814"/>
      <stop offset="100%" stop-color="#05261B"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="tsCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121D18"/>
      <stop offset="100%" stop-color="#0B1310"/>
    </linearGradient>

    <!-- Header Laser Gradient -->
    <linearGradient id="tsHeaderLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6EE7B7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <!-- Micro Grid Pattern -->
    <pattern id="tsGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#34D399" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Container Base & Grid -->
  <rect width="1200" height="135" rx="14" fill="url(#tsBg)"/>
  <rect width="1200" height="135" rx="14" fill="url(#tsGrid)"/>
  <rect width="1200" height="135" rx="14" fill="none" stroke="#16382B" stroke-width="1.2"/>

  <!-- Top Status Bar & Header -->
  <g transform="translate(60, 22)">
    <!-- Live Status Pill -->
    <rect width="160" height="18" rx="9" fill="#0C1914" stroke="#1C4434" stroke-width="1"/>
    <circle cx="10" cy="9" r="3" fill="#34D399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="12" fill="#6EE7B7" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.5">CORE TECH STACK</text>

    <!-- Laser Divider Line -->
    <path d="M 180 9 H 1080" stroke="#143628" stroke-width="1"/>
    <path d="M 180 9 H 1080" stroke="url(#tsHeaderLaser)" stroke-width="1.6" stroke-dasharray="140 760">
      <animate attributeName="stroke-dashoffset" values="0;-900" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

