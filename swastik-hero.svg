<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Swastik Tawate — Developer Profile</title>
  <desc id="heroDesc">A cinematic graphite and emerald green engineering profile banner featuring animated orbital geometry, technical telemetry grid, kinetic gradient spline, and a glowing laser underline.</desc>
  <defs>
    <!-- Background Animated Gradient -->
    <linearGradient id="gemHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0B"/>
      <stop offset="45%" stop-color="#0F1814"/>
      <stop offset="78%" stop-color="#0B2017"/>
      <stop offset="100%" stop-color="#043223"/>
      <animate attributeName="x1" values="0%;25%;0%" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="100%;75%;100%" dur="22s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Kinetic Flowing Path Gradient -->
    <linearGradient id="gemPathLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#34D399" stop-opacity="1"/>
      <stop offset="85%" stop-color="#A7F3D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glowing Underline Gradient -->
    <linearGradient id="gemLaserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6EE7B7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <!-- Telemetry Ambient Glow -->
    <radialGradient id="gemAmbientBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#047857" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080D0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Accent Ambient Bloom -->
    <radialGradient id="gemLeftBloom" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080D0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Cybernetic Technical Grid Pattern -->
    <pattern id="gemGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#34D399" stroke-opacity="0.065" stroke-width="1"/>
      <circle cx="36" cy="36" r="1" fill="#10B981" fill-opacity="0.2"/>
      <circle cx="0" cy="0" r="1.2" fill="#34D399" fill-opacity="0.25"/>
    </pattern>

    <!-- Subtle Dot Matrix Accent -->
    <pattern id="gemDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#6EE7B7" fill-opacity="0.12"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="gemBlurGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
    </filter>
    <filter id="gemTightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="tight"/>
    </filter>

    <!-- Path Fade Mask -->
    <mask id="gemFadeMask">
      <linearGradient id="gemMaskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
        <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="85%" stop-color="#FFFFFF" stop-opacity="1"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      </linearGradient>
      <rect width="1200" height="430" fill="url(#gemMaskGrad)"/>
    </mask>
  </defs>

  <!-- Container Base & Borders -->
  <rect width="1200" height="430" rx="20" fill="url(#gemHeroBg)"/>
  <rect width="1200" height="430" rx="20" fill="url(#gemGrid)"/>
  <rect width="1200" height="430" rx="20" fill="none" stroke="#16382B" stroke-width="1.5"/>

  <!-- Left Ambient Soft Lighting -->
  <rect width="600" height="430" rx="20" fill="url(#gemLeftBloom)"/>

  <!-- Right Side Ambient Bloom Behind Telemetry -->
  <ellipse cx="960" cy="215" rx="280" ry="200" fill="url(#gemAmbientBloom)"/>

  <!-- Telemetry Dot Matrix Accents (Right Section) -->
  <rect x="800" y="40" width="340" height="120" fill="url(#gemDots)" opacity="0.7"/>

  <!-- ROBOTICS & AUTOMATION GYROSCOPIC TELEMETRY RINGS (Center: 960, 215) -->
  <g transform="translate(960, 215)">
    <!-- Cardinal Crosshairs & Radar Ticks -->
    <g stroke="#34D399" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 8">
      <line x1="-220" y1="0" x2="220" y2="0"/>
      <line x1="0" y1="-180" x2="0" y2="180"/>
      <line x1="-150" y1="-150" x2="150" y2="150" stroke-opacity="0.1"/>
      <line x1="-150" y1="150" x2="150" y2="-150" stroke-opacity="0.1"/>
    </g>

    <!-- Outer Fixed Reference Ring -->
    <circle r="190" fill="none" stroke="#10B981" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2 12"/>

    <!-- Counter-Clockwise Outer Orbital Ring -->
    <circle r="165" fill="none" stroke="#34D399" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="14 32 4 8">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="48s" repeatCount="indefinite"/>
    </circle>

    <!-- Primary Clockwise Telemetry Gyro-Ring -->
    <ellipse rx="175" ry="78" fill="none" stroke="#6EE7B7" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="8 12">
      <animateTransform attributeName="transform" type="rotate" from="-32 0 0" to="328 0 0" dur="36s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Secondary Reverse Gyro-Ring -->
    <ellipse rx="175" ry="78" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="18 10 4 6">
      <animateTransform attributeName="transform" type="rotate" from="52 0 0" to="-308 0 0" dur="42s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Inner Core Robotic Joint Indicator -->
    <circle r="95" fill="none" stroke="#34D399" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="6 6"/>
    <circle r="40" fill="#0A1813" stroke="#6EE7B7" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle r="6" fill="#A7F3D0">
      <animate attributeName="r" values="5;7.5;5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="18" fill="none" stroke="#34D399" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3 3">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting Telemetry Sensor Beacons -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
      <circle cx="165" cy="0" r="4.5" fill="#A7F3D0" filter="url(#gemTightGlow)"/>
      <circle cx="165" cy="0" r="2.5" fill="#FFFFFF"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="-180 0 0" dur="18s" repeatCount="indefinite"/>
      <circle cx="95" cy="0" r="3.5" fill="#34D399"/>
      <circle cx="95" cy="0" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Degree Markings / Technical Text -->
    <text x="-192" y="-6" fill="#34D399" font-family="'Consolas', 'Courier New', monospace" font-size="9" letter-spacing="1" fill-opacity="0.6">180°</text>
    <text x="170" y="-6" fill="#34D399" font-family="'Consolas', 'Courier New', monospace" font-size="9" letter-spacing="1" fill-opacity="0.6">000°</text>
    <text x="6" y="-168" fill="#34D399" font-family="'Consolas', 'Courier New', monospace" font-size="9" letter-spacing="1" fill-opacity="0.6">090°</text>
    <text x="6" y="176" fill="#34D399" font-family="'Consolas', 'Courier New', monospace" font-size="9" letter-spacing="1" fill-opacity="0.6">270°</text>
    <text x="110" y="110" fill="#6EE7B7" font-family="'Consolas', 'Courier New', monospace" font-size="10" letter-spacing="1.5" fill-opacity="0.75">SYS.RAD // 45.2°</text>
  </g>

  <!-- KINETIC SIGNAL SPLINE (Streaming Telemetry Flow) -->
  <path d="M520 375 C660 350, 720 280, 810 270 S960 300, 1040 220 S1130 140, 1200 120"
        fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="14" filter="url(#gemBlurGlow)"/>
  <path d="M520 375 C660 350, 720 280, 810 270 S960 300, 1040 220 S1130 140, 1200 120"
        fill="none" stroke="url(#gemPathLine)" stroke-width="2.2" stroke-dasharray="10 12" mask="url(#gemFadeMask)">
    <animate attributeName="stroke-dashoffset" values="0;-220" dur="14s" repeatCount="indefinite"/>
  </path>

  <!-- TYPOGRAPHY & IDENTITY (Left Column) -->
  <!-- Top Technical Status Pill -->
  <g transform="translate(80, 68)">
    <rect width="320" height="26" rx="13" fill="#0E1B16" stroke="#1D4333" stroke-width="1"/>
    <!-- Pulsing Live Indicator -->
    <circle cx="16" cy="13" r="4" fill="#34D399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="13" r="7" fill="none" stroke="#10B981" stroke-opacity="0.5">
      <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="17" fill="#6EE7B7" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2">AUTOMATION &amp; ROBOTICS // AI</text>
  </g>

  <!-- Primary Headline Name -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif">
    <text x="78" y="165" fill="#F0FDF4" font-size="64" font-weight="800" letter-spacing="-1.5">SWASTIK</text>
    <text x="80" y="232" fill="#F0FDF4" font-size="64" font-weight="800" letter-spacing="-1.5">TAWATE</text>

    <!-- Kinetic Emerald Laser Underline -->
    <!-- Base track -->
    <rect x="82" y="258" width="410" height="3" rx="1.5" fill="#0B2E21"/>
    <!-- Glowing Underline Runner (Blurred) -->
    <rect x="82" y="257" width="130" height="5" rx="2.5" fill="#34D399" filter="url(#gemTightGlow)">
      <animate attributeName="x" values="82;362;82" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Sharp Foreground Runner -->
    <rect x="82" y="258" width="130" height="3" rx="1.5" fill="#A7F3D0">
      <animate attributeName="x" values="82;362;82" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Sub-role & Domain -->
    <text x="82" y="302" fill="#A7F3D0" font-size="18.5" font-weight="500" letter-spacing="0.8">Automation &amp; Robotics • Software Engineering • Systems</text>

    <!-- Secondary Statement -->
    <text x="82" y="338" fill="#94A3B8" font-size="13.5" font-weight="400" letter-spacing="0.5">Undergraduate at VESIT Mumbai · Embedded Systems, Full-Stack &amp; Applied AI</text>

    <!-- Engineering Creed / Motto -->
    <g transform="translate(82, 376)">
      <text x="0" y="0" fill="#34D399" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="600" letter-spacing="2.8">PRECISION IN CODE // PURPOSE IN AUTOMATION</text>
    </g>
  </g>

  <!-- Technical Corner Registration Framing (Engineering Aesthetic) -->
  <g stroke="#34D399" stroke-opacity="0.45" stroke-width="1.4" fill="none">
    <!-- Top-Left Bracket -->
    <path d="M 22 55 L 22 22 L 55 22"/>
    <!-- Top-Right Bracket -->
    <path d="M 1145 22 L 1178 22 L 1178 55"/>
    <!-- Bottom-Left Bracket -->
    <path d="M 22 375 L 22 408 L 55 408"/>
    <!-- Bottom-Right Bracket -->
    <path d="M 1145 408 L 1178 408 L 1178 375"/>
  </g>

  <!-- Top-Right Technical Coordinates Stamp -->
  <text x="1158" y="44" fill="#34D399" fill-opacity="0.5" font-family="'Consolas', 'Courier New', monospace" font-size="9" text-anchor="end" letter-spacing="1.5">VESIT // IN:19.046°N 72.889°E</text>
</svg>