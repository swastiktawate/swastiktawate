<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Swastik Tawate — Developer Profile</title>
  <desc id="heroDesc">Compact cinematic graphite and emerald green banner featuring kinetic telemetry, orbital kinematics, and engineering identity.</desc>
  <defs>
    <!-- Background Animated Gradient -->
    <linearGradient id="gemHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0B"/>
      <stop offset="45%" stop-color="#0F1814"/>
      <stop offset="78%" stop-color="#0B2017"/>
      <stop offset="100%" stop-color="#043223"/>
      <animate attributeName="x1" values="0%;25%;0%" dur="20s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Kinetic Flowing Spline Gradient -->
    <linearGradient id="gemPathLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#34D399" stop-opacity="1"/>
      <stop offset="85%" stop-color="#A7F3D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Telemetry Ambient Glow -->
    <radialGradient id="gemAmbientBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#047857" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080D0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Micro Grid Pattern -->
    <pattern id="gemGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#34D399" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="30" cy="30" r="0.8" fill="#10B981" fill-opacity="0.2"/>
    </pattern>

    <!-- Tight Glow Filter -->
    <filter id="gemTightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="tight"/>
    </filter>
  </defs>

  <!-- Container Base & Grid -->
  <rect width="1200" height="210" rx="16" fill="url(#gemHeroBg)"/>
  <rect width="1200" height="210" rx="16" fill="url(#gemGrid)"/>
  <rect width="1200" height="210" rx="16" fill="none" stroke="#16382B" stroke-width="1.2"/>

  <!-- Telemetry Bloom (Right) -->
  <ellipse cx="980" cy="105" rx="200" ry="95" fill="url(#gemAmbientBloom)"/>

  <!-- ROBOTICS GYROSCOPIC TELEMETRY RINGS (Center: 980, 105) -->
  <g transform="translate(980, 105)">
    <!-- Radar Crosshairs -->
    <g stroke="#34D399" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 6">
      <line x1="-150" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="-85" x2="0" y2="85"/>
    </g>

    <!-- Outer Fixed Reference Ring -->
    <circle r="86" fill="none" stroke="#10B981" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 8"/>

    <!-- Counter-Clockwise Orbital Ring -->
    <circle r="72" fill="none" stroke="#34D399" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="10 20 3 6">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="40s" repeatCount="indefinite"/>
    </circle>

    <!-- Primary Clockwise Telemetry Gyro-Ring -->
    <ellipse rx="82" ry="36" fill="none" stroke="#6EE7B7" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="-25 0 0" to="335 0 0" dur="30s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Inner Core Robotic Joint Indicator -->
    <circle r="22" fill="#0A1813" stroke="#6EE7B7" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle r="4.5" fill="#A7F3D0">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting Telemetry Sensor Beacon -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
      <circle cx="72" cy="0" r="3.5" fill="#A7F3D0" filter="url(#gemTightGlow)"/>
      <circle cx="72" cy="0" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Degree Markings -->
    <text x="-98" y="-4" fill="#34D399" font-family="'Consolas', monospace" font-size="8" fill-opacity="0.6">180°</text>
    <text x="88" y="-4" fill="#34D399" font-family="'Consolas', monospace" font-size="8" fill-opacity="0.6">000°</text>
    <text x="60" y="58" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="8.5" letter-spacing="1" fill-opacity="0.75">SYS.RAD // 45.2°</text>
  </g>

  <!-- KINETIC SIGNAL SPLINE -->
  <path d="M520 185 C640 170, 700 135, 780 130 S920 150, 1020 110 S1110 70, 1200 60"
        fill="none" stroke="url(#gemPathLine)" stroke-width="2" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" values="0;-180" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- TYPOGRAPHY & IDENTITY (Left Column) -->
  <!-- Top Technical Status Pill -->
  <g transform="translate(60, 24)">
    <rect width="250" height="22" rx="11" fill="#0E1B16" stroke="#1D4333" stroke-width="1"/>
    <circle cx="14" cy="11" r="3.5" fill="#34D399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="14.5" fill="#6EE7B7" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.8">AUTOMATION &amp; ROBOTICS // AI/ML</text>
  </g>

  <!-- Primary Headline Name -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="58" y="86" fill="#F0FDF4" font-size="46" font-weight="800" letter-spacing="-1">SWASTIK TAWATE</text>

    <!-- Kinetic Emerald Laser Underline -->
    <rect x="60" y="98" width="370" height="2.5" rx="1.25" fill="#0B2E21"/>
    <rect x="60" y="97" width="110" height="4.5" rx="2.25" fill="#34D399" filter="url(#gemTightGlow)">
      <animate attributeName="x" values="60;320;60" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="98" width="110" height="2.5" rx="1.25" fill="#A7F3D0">
      <animate attributeName="x" values="60;320;60" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Sub-role & Domain -->
    <text x="60" y="132" fill="#A7F3D0" font-size="15.5" font-weight="600" letter-spacing="0.5">Automation &amp; Robotics • AI/ML • Systems</text>

    <!-- Secondary Statement -->
    <text x="60" y="157" fill="#94A3B8" font-size="12" font-weight="400">Undergraduate at VESIT Mumbai · B.Tech in Automation &amp; Robotics</text>

    <!-- Engineering Creed -->
    <text x="60" y="184" fill="#34D399" font-family="'Consolas', monospace" font-size="10.5" font-weight="600" letter-spacing="2.5">PRECISION IN CODE // PURPOSE IN AUTOMATION</text>
  </g>

  <!-- Technical Corner Brackets -->
  <g stroke="#34D399" stroke-opacity="0.4" stroke-width="1.2" fill="none">
    <path d="M 18 36 L 18 16 L 38 16"/>
    <path d="M 1162 16 L 1182 16 L 1182 36"/>
    <path d="M 18 174 L 18 194 L 38 194"/>
    <path d="M 1162 194 L 1182 194 L 1182 174"/>
  </g>

  <!-- Top-Right Coordinates Stamp -->
  <text x="1165" y="32" fill="#34D399" fill-opacity="0.5" font-family="'Consolas', monospace" font-size="8.5" text-anchor="end" letter-spacing="1.2">VESIT // IN:19.046°N 72.889°E</text>
</svg>