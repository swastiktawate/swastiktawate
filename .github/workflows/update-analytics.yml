name: Update GitHub Analytics SVG

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'swastik-github-analytics.svg'
      - 'assets/swastik-github-analytics.svg'

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Live Metrics and Update SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_analytics.py

      - name: Commit and Push Updated SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add swastik-github-analytics.svg assets/swastik-github-analytics.svg
          git diff --staged --quiet || (git commit -m "chore: auto-update live GitHub analytics metrics" && git pull --rebase origin main && git push)
